    <line x1="70" y1="171.7" x2="710" y2="208" stroke="#333" stroke-width="1.6"/>
    <text x="700" y="224" text-anchor="end" font-size="10" fill="#444">fit: -0.003 accuracy / AA point</text>

    <g fill="#333">
