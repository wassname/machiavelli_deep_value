    <line x1="70" y1="85" x2="70" y2="330" stroke="#777" stroke-width="0.8"/>
    <line x1="70" y1="207.5" x2="710" y2="207.5" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
